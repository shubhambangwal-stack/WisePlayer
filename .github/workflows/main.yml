name: We2Meet Deployment Script

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SSH and Run Script
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -x

            echo "===== USER INFO ====="
            whoami
            pwd
            hostname

            echo "===== SSH INFO ====="
            ls -la ~/.ssh || true
            ssh-add -l || true

            echo "===== GITHUB TEST ====="
            ssh -o StrictHostKeyChecking=no -T git@github.com || true

            echo "===== REPO INFO ====="
            cd /var/www/matriomony-backend-
            git remote -v
            git branch
            git status

            echo "===== TEST REMOTE ACCESS ====="
            git ls-remote origin || true

            echo "===== SSH DEBUG ====="
            ssh -vT git@github.com || true

            echo "===== DEPLOY ====="
            ./deploy.sh
