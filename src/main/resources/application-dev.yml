spring:
  application:
    name: wiseplayer

  datasource:
    url: ${DEV_DATABASE_URL:jdbc:postgresql://localhost:5432/wiseplayer}
    username: ${DEV_DATABASE_USERNAME:postgres}
    password: ${DEV_DATABASE_PASSWORD:postgres}
  jpa:
    generate-ddl: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: create

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false



paypal:
  mode: ${PAYPAL_MODE:sandbox}
  client-id: ${PAYPAL_CLIENT_ID}
  client-secret: ${PAYPAL_CLIENT_SECRET}
  return-url: ${APP_BASE_URL}/api/payment/paypal/success
  cancel-url: ${APP_BASE_URL}/api/payment/paypal/cancel
  webhook-url: ${APP_BASE_URL}/api/payment/paypal/webhook
  webhook-id: ${PAYPAL_WEBHOOK_ID}

server:
  port: 8080

app:
  base-url: ${APP_FRONTEND_URL:https://admin.wise-player.com}
  security:
    token-secrets:
      - d2lzZXBsYXllci1kZXZpY2Utc2VjdXJpdHktc2VjcmV0LWtleS0yMDI0LXYy
      - d2lzZXBsYXllci1kZXZpY2Utc2VjdXJpdHktc2VjcmV0LWtleS0yMDI0LXZz
      - d2lzZXBsYXllci1kZXZpY2Utc2VjdXJpdHktc2VjcmV0LWtleS0yMDI0LXXx
    token-ttl-minutes: 1
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:5173"
      - "https://admin.wise-player.com"
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
    allowed-headers:
      - Authorization
      - Content-Type
      - X-Device-Token
      - X-Device-Fingerprint
      - X-Admin-Token
      - Cache-Control
    allow-credentials: true


    # Refresh tokens are managed internally (not exposed in API)

springdoc:
  api-docs:
    path: /wp-api-spec
  swagger-ui:
    path: /wp-docs
    disable-swagger-default-url: true
    config-url: /wp-api-spec/swagger-config
  webjars:
    prefix: /wp-docs-assets
  show-actuator: false
