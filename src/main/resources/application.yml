paypal:
  mode: ${PAYPAL_MODE:sandbox}
  client-id: ${PAYPAL_CLIENT_ID}
  client-secret: ${PAYPAL_CLIENT_SECRET}
  return-url: ${APP_BASE_URL}/api/payment/paypal/success
  cancel-url: ${APP_BASE_URL}/api/payment/paypal/cancel
  webhook-url: ${APP_BASE_URL}/api/payment/paypal/webhook
  webhook-id: ${PAYPAL_WEBHOOK_ID}

server:
  port: ${SERVER_PORT}

app:
  security:
    token-secrets:
      - ${SECURITY_TOKEN_SECRET_1}
      - ${SECURITY_TOKEN_SECRET_2}
      - ${SECURITY_TOKEN_SECRET_3}
    token-ttl-minutes: ${TOKEN_TTL_MINUTES}


    # Refresh tokens are managed internally (not exposed in API)
