server:
  port: ${SERVER_PORT}

app:
  security:
    token-secrets:
      - ${SECURITY_TOKEN_SECRET_1}
      - ${SECURITY_TOKEN_SECRET_2}
      - ${SECURITY_TOKEN_SECRET_3}
    seed-secret: ${SECURITY_SEED_SECRET:wiseplayer-default-seed-secret}
    token-ttl-minutes: ${TOKEN_TTL_MINUTES:1}
    admin-frontend-url: ${ADMIN_FRONTEND_URL:https://admin.wise-player.com}
    allowed-origins: ${ALLOWED_ORIGINS:https://wise-player.com,https://admin.wise-player.com}
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
    allowed-headers:
      - Authorization
      - Content-Type
      - X-Device-Token
      - X-Device-Fingerprint
      - X-Admin-Token
      - Cache-Control
    allow-credentials: true


  # Refresh tokens are managed internally (not exposed in API)

springdoc:
  api-docs:
    path: /wp-api-spec
  swagger-ui:
    path: /wp-docs
    disable-swagger-default-url: true
    config-url: /wp-api-spec/swagger-config
  webjars:
    prefix: /wp-docs-assets
  show-actuator: false

management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: "health,info"
      base-path: /wp-admin-monitor
    info:
      enabled: true
  info:
    java:
      enabled: false
    os:
      enabled: false
