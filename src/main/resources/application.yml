spring:
  application:
    name: wiseplayer
#  profiles:
#    active: dev
 # flyway:
  #  enabled: true
   # baseline-on-migrate: true
   # baseline-version: 1
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    generate-ddl: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true


paypal:

  mode: ${PAYPAL_MODE:sandbox}
  client-id: ${PAYPAL_CLIENT_ID}
  client-secret: ${PAYPAL_CLIENT_SECRET}
  return-url: ${APP_BASE_URL:http://localhost:8080}/api/payment/paypal/success
  cancel-url: ${APP_BASE_URL:http://localhost:8080}/api/payment/paypal/cancel
  webhook-url: ${APP_BASE_URL:http://localhost:8080}/api/payment/paypal/webhook
  webhook-id: ${PAYPAL_WEBHOOK_ID}
  frontend-url: ${FRONTEND_URL:https://wise-player.com}

server:
  port: ${SERVER_PORT:8081}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  security:
    seed-secret: ${SEED_SECRET:super-secret-seed-key}
    token-secrets:
      - ${SECURITY_TOKEN_SECRET_1}
      - ${SECURITY_TOKEN_SECRET_2}
      - ${SECURITY_TOKEN_SECRET_3}
    token-ttl-minutes: ${TOKEN_TTL_MINUTES:40}
    admin-frontend-url: ${ADMIN_FRONTEND_URL:https://admin.wise-player.com}
    allowed-origins: ${ALLOWED_ORIGINS:https://wise-player.com,https://admin.wise-player.com}
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
    allowed-headers:
      - Authorization
      - Content-Type
      - X-Device-Token
      - X-Device-Fingerprint
      - X-Admin-Token
      - Cache-Control
    allow-credentials: true


  # Refresh tokens are managed internally (not exposed in API)

springdoc:
  api-docs:
    path: /wp-api-spec
  swagger-ui:
    path: /wp-docs
    disable-swagger-default-url: true
    config-url: /wp-api-spec/swagger-config
  webjars:
    prefix: /wp-docs-assets
  show-actuator: false

management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: "health,info"
      base-path: /wp-admin-monitor
    info:
      enabled: true
  info:
    java:
      enabled: false
    os:
      enabled: false
