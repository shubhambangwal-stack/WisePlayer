spring:
  application:
    name: wiseplayer
  profiles:
    active: dev
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    generate-ddl: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate


paypal:
  mode: ${PAYPAL_MODE:sandbox}
  client-id: ${PAYPAL_CLIENT_ID}
  client-secret: ${PAYPAL_CLIENT_SECRET}
  return-url: ${APP_BASE_URL}/api/payment/paypal/success
  cancel-url: ${APP_BASE_URL}/api/payment/paypal/cancel
  webhook-url: ${APP_BASE_URL}/api/payment/paypal/webhook
  webhook-id: ${PAYPAL_WEBHOOK_ID}
  frontend-url: ${FRONTEND_URL:https://wise-player.com}

server:
  port: ${SERVER_PORT}

app:
  security:
    token-secrets:
      - ${SECURITY_TOKEN_SECRET_1}
      - ${SECURITY_TOKEN_SECRET_2}
      - ${SECURITY_TOKEN_SECRET_3}
    token-ttl-minutes: ${TOKEN_TTL_MINUTES}
    allowed-origins: ${ALLOWED_ORIGINS:https://wise-player.com,https://admin.wise-player.com}
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
    allowed-headers:
      - Authorization
      - Content-Type
      - X-Device-Token
      - X-Device-Fingerprint
      - X-Admin-Token
      - Cache-Control
    allow-credentials: true


  # Refresh tokens are managed internally (not exposed in API)

springdoc:
  api-docs:
    path: /wp-api-spec
  swagger-ui:
    path: /wp-docs
    disable-swagger-default-url: true
    config-url: /wp-api-spec/swagger-config
  webjars:
    prefix: /wp-docs-assets
  show-actuator: false

management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: "health,info"
      base-path: /wp-admin-monitor
    info:
      enabled: true
  info:
    java:
      enabled: false
    os:
      enabled: false
